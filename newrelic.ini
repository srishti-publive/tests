[newrelic]

# IMPORTANT: Move this key to the NEW_RELIC_LICENSE_KEY environment variable
# in production to avoid accidental exposure in git history. The NR Python agent
# automatically reads that env var and overrides this setting.
license_key = c231cccba0b778b69adffb79956aed2a2de0NRAL

app_name = Publive MCP
monitor_mode = true
log_file = stdout
log_level = info
high_security = false

# proxy_scheme = http
# proxy_host = hostname
# proxy_port = 8080
# proxy_user =
# proxy_pass =

# attributes.include = request.parameters.*

transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5
transaction_tracer.function_trace =

error_collector.enabled = true

# Benign OS-level exceptions that are NOT server errors:
#   BrokenPipeError — SSE client disconnects mid-stream (normal close)
#   ConnectionResetError — proxy or client resets the TCP connection
# Recording these as NR errors inflates error rate and obscures real failures.
error_collector.ignore_classes = builtins:BrokenPipeError builtins:ConnectionResetError

error_collector.expected_classes =

# Disabled: this is a pure JSON API server with no browser-rendered HTML pages.
# Auto-instrumentation would try to inject JS into every response for no benefit.
browser_monitoring.auto_instrument = false

thread_profiler.enabled = true

# api_key =

distributed_tracing.enabled = true

application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.local_decorating.enabled = true
application_logging.metrics.enabled = true


[newrelic:development]
monitor_mode = false


[newrelic:staging]
app_name = Publive MCP (Staging)
monitor_mode = true

[newrelic:production]
monitor_mode = true
