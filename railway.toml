[build]
builder = "dockerfile"

[deploy]
# Migrations run in the container entrypoint (see entrypoint.sh / Dockerfile CMD),
# not in a release phase — so they apply reliably with visible logs and a failing
# release phase can't silently block the deploy. No startCommand override here, so
# the Dockerfile CMD is the single start path.
# Root endpoint is dependency-free (no DB, no session) so the healthcheck reflects
# pure process liveness rather than the auth/session layer.
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
